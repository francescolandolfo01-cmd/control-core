[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# name "ccref", version "0.1.0", description, requires-python ">=3.10"
# dependencies: numpy>=1.26, scipy>=1.11

name = "ccref"
version = "0.1.0"
description = "Riferimenti Python (NumPy/SciPy) per i test di control-core"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
